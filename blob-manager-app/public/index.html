<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blob Manager</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main>
      <h1>Blob Manager</h1>

      <section>
        <h2>Admin Access</h2>
        <form id="login-form">
          <label for="adminAccessKey">Admin access key</label>
          <input id="adminAccessKey" type="password" required />
          <button type="submit">Sign in</button>
        </form>
        <button id="logout" type="button">Sign out</button>
      </section>

      <section>
        <h2>Upload Files</h2>
        <form id="upload-form">
          <input id="files" name="files" type="file" multiple required />
          <button type="submit">Upload</button>
        </form>
      </section>

      <section>
        <h2>Blobs</h2>
        <button id="refresh" type="button">Refresh</button>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Size</th>
              <th>Created</th>
              <th>Content Type</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="blob-list"></tbody>
        </table>
      </section>

      <section>
        <h2>Edit Text Blob</h2>
        <form id="edit-form">
          <label for="blobName">Blob Name</label>
          <input id="blobName" required />
          <label for="blobContentType">Content Type</label>
          <input id="blobContentType" value="text/plain; charset=utf-8" />
          <label for="blobContent">Content</label>
          <textarea id="blobContent" rows="12"></textarea>
          <button type="submit">Save</button>
        </form>
      </section>

      <pre id="status"></pre>
    </main>
    <script src="/js/app.js"></script>
  </body>
</html>
